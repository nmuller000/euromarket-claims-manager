- # ====== Region: Company =====================================
  id: 58806320251905804
  identification: 
    name: Company
    type: Form

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select p.party_id,
             p.name,
             p.vat_national_number,
             p.country_code,
             p.country_name,
             p.country_valid_yn,
             p.street,
             p.postal_code,
             p.city,
             p.language_code,
             p.language_name,
             p.language_valid_yn,
             p.roles,
             p.roles_in_use,
             (select listagg(t.name, ', ') within group (order by t.name)
              from   emk_api.emk_v_party_role_types t
              where  instr(':' || p.roles_in_use || ':', ':' || t.role_code || ':') > 0) as roles_in_use_names,
             p.deletable_yn,
             p.row_version
      from   emk_api.emk_v_parties p
      

  layout: 
    sequence: 10
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Blank with Attributes
    template-options: 
    - '#DEFAULT#'
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    region-display-selector: false
    exclude-title-from-translation: false

  read-only: 
    type: Expression
    language: PL/SQL
    pl/sql-expression: not apex_authorization.is_authorized('CAN_EDIT_PARTIES_SHIPMENTS')

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    edit: 
      enabled: true
      allowed-operations: 
      - Add Row
      - Update Row
      - Delete Row
      lost-update-type: Row Values

