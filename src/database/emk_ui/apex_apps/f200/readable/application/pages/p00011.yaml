- # ====== Dynamic Action: VAT prefix and postcode example of th
  id: 59011235006209936
  identification: 
    name: VAT prefix and postcode example of the country

  execution: 
    sequence: 20
    event-scope: Static
    type: Immediate

  when: 
    event: Change
    selection-type: Item(s)
    item(s): 
    - P11_COUNTRY_CODE

  actions: 
  - # ====== Action: Set VAT prefix  and VAT example =============
    id: 59011324402209937
    identification: 
      name: Set VAT prefix  and VAT example
      action: Set Value

    settings: 
      set-type: SQL Statement
      sql-statement: |
        -- Seq 10: prefix and example of the country (the format itself stays in the API)
        select vat_prefix, national_example
        from   emk_api.emk_v_vat_formats
        where  country_code = :P11_COUNTRY_CODE
        and    valid_yn = 'Y'
        
      items-to-submit: 
      - P11_COUNTRY_CODE
      escape-special-characters: true
      suppress-change-event: true

    affected-elements: 
      selection-type: Item(s)
      item(s): 
      - P11_VAT_PREFIX
      - P11_VAT_EXAMPLE

    execution: 
      sequence: 10
      event: VAT prefix and postcode example of the country # 59011235006209936
      fire-when-event-result-is: True
      fire-on-initialization: true
      stop-execution-on-error: true
      wait-for-result: true

  - # ====== Action: Clear VAT national number ===================
    id: 59011454779209938
    identification: 
      name: Clear VAT national number
      action: Clear

    affected-elements: 
      selection-type: Item(s)
      item(s): 
      - P11_VAT_NATIONAL_NUMBER

    execution: 
      sequence: 30
      event: VAT prefix and postcode example of the country # 59011235006209936
      fire-when-event-result-is: True
      fire-on-initialization: true

    client-side-condition: 
      type: Item is null
      item: P11_VAT_PREFIX

    security: 
      authorization-scheme: CAN_EDIT_PARTIES_SHIPMENTS # 58219703941168892

  - # ====== Action: Execute Server-side Code ====================
    id: 59011575898209939
    identification: 
      action: Execute Server-side Code

    settings: 
      language: PE.PROPERTY.SOURCE_SNIPPET_LANG.LOV.PLSQL.D
      pl/sql-code: null;
      items-to-submit: 
      - P11_VAT_NATIONAL_NUMBER

    execution: 
      sequence: 40
      event: VAT prefix and postcode example of the country # 59011235006209936
      fire-when-event-result-is: True
      fire-on-initialization: false
      stop-execution-on-error: true
      wait-for-result: true

    client-side-condition: 
      type: Item is null
      item: P11_VAT_PREFIX

    security: 
      authorization-scheme: CAN_EDIT_PARTIES_SHIPMENTS # 58219703941168892

  - # ====== Action: Disable VAT national number =================
    id: 59011634675209940
    identification: 
      name: Disable VAT national number
      action: Disable

    affected-elements: 
      selection-type: Item(s)
      item(s): 
